let svT;const setSt=(t,c)=>{const e=document.getElementById("sv2");if(!e)return;clearTimeout(svT);e.className=c||"";e.textContent=t;e.style.display=t?"block":"none";if(c==="ok")svT=setTimeout(()=>{e.style.display="none"},2500)};
function flush(k){const t=timers[k];if(!t)return;clearTimeout(t.t);delete timers[k];const rows=S[t.m]&&S[t.m][t.d];if(!db||!rows)return;
 let done=false;const w=setTimeout(()=>{if(!done)setSt("Belum terkirim ke server. Periksa koneksi internet atau aturan Firestore.","er")},10000);
 db.collection("days").doc(k).set({m:t.m,d:t.d,rows,ts:Date.now()}).then(()=>{done=true;clearTimeout(w);setSt("Tersimpan ✓","ok")}).catch(e=>{done=true;clearTimeout(w);setSt("Gagal menyimpan: "+(e.code||e.message)+(e.code==="permission-denied"?" (aturan Firestore belum benar)":""),"er")})}
function save(m,d){const k=dkey(m,d);if(timers[k])clearTimeout(timers[k].t);timers[k]={m,d,t:setTimeout(()=>flush(k),400)};setSt("Menyimpan…")}
const flushAll=()=>Object.keys(timers).forEach(flush);
addEventListener("pagehide",flushAll);document.addEventListener("visibilitychange",()=>{if(document.hidden)flushAll()});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let su=null;try{su=sessionStorage.getItem("u")}catch(e){}
let st={user:su,date:today(),tab:"dash",per:"w",sel:MEM[0],mm:today().slice(0,7),ms:"all"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const km=e=>e.kmB>e.kmA&&e.kmA>=0?e.kmB-e.kmA:0;

function rng(per,d){const dt=new Date(d+"T00:00:00"),f=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 if(per==="d")return[d,d];
 if(per==="w"){const a=new Date(dt);a.setDate(dt.getDate()-(dt.getDay()+6)%7);const b=new Date(a);b.setDate(a.getDate()+6);return[f(a),f(b)]}
 return[d.slice(0,7)+"-01",d.slice(0,7)+"-31"]}
const tg=per=>{const f=per==="m"?1:per==="w"?4:20;return{call:Math.round(T.call/f),visit:Math.round(T.visit/f)}};
function stats(m,s,e){let c=0,v=0,k=0;for(const d in(S[m]||{}))if(d>=s&&d<=e)for(const x of S[m][d]){c+=+x.call||0;v+=+x.visit||0;k+=km(x)}
 return{c,v,k,raw:bbm(k),cl:Math.min(bbm(k),T.pagu)}}
function agg(m,s,e){const mp={};
 for(const d of Object.keys(S[m]||{}).sort())if(d>=s&&d<=e)for(const x of S[m][d]){
  const nm=x.nama.trim();if(!nm&&!x.call&&!x.visit&&!x.ket&&!km(x))continue;
  const o=mp[(nm||"(tanpa nama)").toLowerCase()]=mp[(nm||"(tanpa nama)").toLowerCase()]||{nama:nm||"(tanpa nama)",c:0,v:0,k:0};
  o.c+=+x.call||0;o.v+=+x.visit||0;o.k+=km(x)}
 return Object.values(mp)}
function aggD(m,s,e){const mp={};
 for(const d of Object.keys(S[m]||{}).sort())if(d>=s&&d<=e)S[m][d].forEach((x,i)=>{
  const nm=x.nama.trim();if(!nm&&!x.call&&!x.visit&&!x.ket&&!km(x))return;
  const key=(nm||"(tanpa nama)").toLowerCase()+"|"+d,o=mp[key]=mp[key]||{nama:nm||"(tanpa nama)",alamat:x.alamat,d,c:0,v:0,k:0,l:[],ph:[]};
  o.c+=+x.call||0;o.v+=+x.visit||0;o.k+=km(x);if(!o.alamat)o.alamat=x.alamat;
  if(x.ket||x.call||x.visit)o.l.push(x.jenis+(x.ket?": "+x.ket:""));
  if(x.foto)o.ph.push(m+"|"+d+"|"+i)});
 const lo=o=>o.nama.toLowerCase();
 return Object.values(mp).sort((p,q)=>lo(p)<lo(q)?-1:lo(p)>lo(q)?1:p.d<q.d?-1:1)}
const fd=d=>d.slice(8)+"/"+d.slice(5,7)+"/"+d.slice(0,4);

/* ---------- Foto (IndexedDB) ---------- */
const phc={};
const pid=k=>{const[m,d,i]=k.split("|");return slug(m)+"__"+d+"__"+i};
const pget=async k=>{if(k in phc)return phc[k];try{const x=await db.collection("photos").doc(pid(k)).get();return phc[k]=x.exists?x.data().data:null}catch(e){return null}};
const pset=(k,v)=>{phc[k]=v;db.collection("photos").doc(pid(k)).set({data:v,ts:Date.now()}).catch(()=>alert("Foto gagal tersimpan ke server."));return Promise.resolve()};
const pdel=k=>{delete phc[k];return db.collection("photos").doc(pid(k)).delete()};
const shrink=f=>new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);{const o=c.toDataURL("image/jpeg",.6);o.length>900000?no():ok(o)}};im.onerror=no;im.src=u});
const fillPh=r=>r.querySelectorAll("img[data-ph]").forEach(im=>pget(im.dataset.ph).then(v=>{if(v){im.src=v;im.hidden=false}else im.remove()}));
document.addEventListener("click",e=>{const im=e.target.closest("img[data-zoom]");if(!im||!im.src)return;const o=document.createElement("div");
 o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99;cursor:zoom-out";
 o.innerHTML=`<img src="${im.src}" style="max-width:96%;max-height:96%">`;o.onclick=()=>o.remove();document.body.appendChild(o)});

/* XLSX */
function crc32(b){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<b.length;i++)r=t[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0}
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
 for(const[n,t]of files){const nb=enc.encode(n),d=enc.encode(t),c=crc32(d);
  const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0)]);
  parts.push(h,nb,d);
  cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(d.length),...u32(d.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=h.length+nb.length+d.length}
 let cs=0;cd.forEach(x=>cs+=x.length);
 const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
 return new Blob([...parts,...cd,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}
const colL=i=>{let s="";i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26)}return s};
const xe=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,"");
const HX='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
function sheetXml(rows){return HX+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows.map((r,i)=>`<row r="${i+1}">`+r.map((v,j)=>typeof v==="number"?`<c r="${colL(j)}${i+1}"><v>${v}</v></c>`:`<c r="${colL(j)}${i+1}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`).join("")+"</row>").join("")+"</sheetData></worksheet>"}
function xlsx(sh){const R="http://schemas.openxmlformats.org/officeDocument/2006/relationships",M="http://schemas.openxmlformats.org/spreadsheetml/2006/main";
 return zip([
 ["[Content_Types].xml",HX+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sh.map((x,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")+"</Types>"],
 ["_rels/.rels",HX+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
 ["xl/workbook.xml",HX+`<workbook xmlns="${M}" xmlns:r="${R}"><sheets>`+sh.map((x,i)=>`<sheet name="${xe(x[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")+"</sheets></workbook>"],
 ["xl/_rels/workbook.xml.rels",HX+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sh.map((x,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")+"</Relationships>"],
 ...sh.map((x,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXml(x[1])])])}
/* END XLSX */
async function exportXlsx(){
 if(!st.user)return;
 const adm=st.user===ADM,ms=adm?MEM:[st.user],per=adm?st.per:"m",[s,e]=rng(per,st.date),t=adm?tg(per):{call:T.call,visit:T.visit};
 if(adm&&db){try{const sn=await db.collection("days").where("d",">=",s).where("d","<=",e).get();sn.forEach(q=>{const x=q.data();if(!timers[q.id])(S[x.m]=S[x.m]||{})[x.d]=x.rows})}catch(x){}}
 const lbl=per==="m"?st.date.slice(0,7):per==="d"?s:s+"_sd_"+e;
 const A=[["Anggota","Call","Target call","% Call","Visit","Target visit","% Visit","Rata-rata %","Total KM","Klaim BBM (Rp)"]],
 B=[["Anggota","Mitra","Alamat","Tanggal","Call","Visit","KM","Klaim BBM (Rp)","Penjelasan aktivitas"]],
 C=[["Anggota","Tanggal","Mitra","Alamat","Call","Visit","Jenis aktivitas","Penjelasan","KM awal","KM akhir","Total KM","Klaim BBM (Rp)"]];
 for(const m of ms){const x=stats(m,s,e),pc=pct(x.c,t.call),pv=pct(x.v,t.visit);

/* ---------- Login & PIN ---------- */
function renderLogin(){
 $("#app").innerHTML=`<div class="login"><div class="lgo">${logoHtml(72,1)}</div><h1>Aktivitas Sales</h1><div class="org">Laznas Yakesma</div><blockquote class="q2">${QUOTE}</blockquote><div class="card"><h2 style="margin-top:0">Masuk</h2><label>Nama</label><select id="ln">${[...MEM,ADM].map(x=>`<option>${esc(x)}</option>`).join("")}</select><label style="margin-top:10px">PIN</label><input type="password" id="lp" inputmode="numeric" maxlength="6" autocomplete="off"><div id="le" style="color:var(--wr);min-height:20px;margin:6px 0"></div><button class="p" id="lg" style="width:100%">Masuk</button></div></div>`;
 const go=()=>{const n=$("#ln").value;if($("#lp").value===getPin(n)){st.user=n;st.sel=MEM[0];try{sessionStorage.setItem("u",n)}catch(e){}render()}else{$("#le").textContent="PIN salah.";$("#lp").value=""}};
 $("#lg").onclick=go;$("#lp").onkeydown=e=>{if(e.key==="Enter")go()}}
$("#pin").onclick=()=>{const o=prompt("Masukkan PIN lama:");if(o===null)return;if(o!==getPin(st.user))return alert("PIN lama salah.");
 const n=prompt("PIN baru (4–6 angka):");if(n===null)return;if(!/^\d{4,6}$/.test(n))return alert("PIN harus 4–6 angka.");setPin(st.user,n);alert("PIN berhasil diganti.")};
$("#out").onclick=()=>{flushAll();st.user=null;S={};subKey="";if(unsub){unsub();unsub=null}try{sessionStorage.removeItem("u")}catch(e){}render()};

/* ---------- Rekap & form input ---------- */
function kpiHtml(m,d){const[s,e]=rng("m",d),x=stats(m,s,e),ym=d.slice(0,7);
 return`<div class="card"><b>Capaian vs target · ${ym}</b><div style="margin-top:10px">${bar("Call",x.c,T.call)}${bar("Visit",x.v,T.visit)}</div></div>
 <div class="card"><div class="mu">Total klaim BBM bulan ${ym}</div><div class="big">${rp(x.cl)}</div>
 <div class="mu">${x.k} KM ÷ 12 × Rp 10.000 = ${rp(x.raw)}</div><div class="mu">Pagu maksimal ${rp(T.pagu)}</div>
 <div class="bar"><i style="width:${pct(x.cl,T.pagu)}%"></i></div></div>`}
function recap(m,date){const[s,e]=rng("m",date),ym=date.slice(0,7);
 const tb=L=>{let c=0,v=0,k=0;const r=L.map(o=>{c+=o.c;v+=o.v;k+=o.k;return`<tr><td>${esc(o.nama)}</td><td class="r">${o.c}</td><td class="r">${o.v}</td><td class="r">${o.k}</td><td class="r">${rp(bbm(o.k))}</td></tr>`}).join("")||`<tr><td colspan="5" class="mu">Belum ada data.</td></tr>`;
  return`<table><tr><th>Mitra</th><th class="r">Call</th><th class="r">Visit</th><th class="r">KM</th><th class="r">Klaim BBM</th></tr>${r}<tr><th>Total</th><th class="r">${c}</th><th class="r">${v}</th><th class="r">${k}</th><th class="r">${rp(bbm(k))}</th></tr></table>`};
 return`<h2>Rekap harian (${date})</h2><div class="card tw">${tb(agg(m,date,date))}</div>
 <h2>Akumulasi bulan ${ym}</h2><div class="card tw">${tb(agg(m,s,e))}<div class="mu" style="margin-top:8px">Klaim BBM = total KM ÷ 12 × Rp 10.000. Total klaim bulan ini setelah pagu ${rp(T.pagu)}: <b>${rp(stats(m,s,e).cl)}</b></div></div>`}
const counter=(i,k,v)=>`<div class="ct"><button data-i="${i}" data-k="${k}" data-d="-1">−</button><input type="number" min="0" data-i="${i}" data-k="${k}" value="${v}"><button data-i="${i}" data-k="${k}" data-d="1">+</button></div>`;
const card=(e,i)=>`<div class="card"><div class="top"><b>Mitra ${i+1}</b><span class="mu">Total KM: <span class="tot" id="t${i}">${km(e)}</span> km · <span class="tot" id="r${i}">${rp(bbm(km(e)))}</span></span></div>
 <div class="grid">
  <div><label>Nama mitra</label><input data-i="${i}" data-k="nama" value="${esc(e.nama)}"></div>
  <div><label>Alamat mitra</label><input data-i="${i}" data-k="alamat" value="${esc(e.alamat)}"></div>
  <div><label>Call (x)</label>${counter(i,"call",e.call)}</div>
  <div><label>Visit (x)</label>${counter(i,"visit",e.visit)}</div>
  <div><label>Keterangan aktivitas</label><select data-i="${i}" data-k="jenis">${JENIS.map(j=>`<option ${j==e.jenis?"selected":""}>${j}</option>`).join("")}</select></div>
  <div><label>KM awal (klaim BBM visit)</label>${counter(i,"kmA",e.kmA)}</div>
  <div><label>KM akhir</label>${counter(i,"kmB",e.kmB)}</div>
 </div><label style="margin-top:8px">Penjelasan aktivitas</label><textarea data-i="${i}" data-k="ket">${esc(e.ket)}</textarea><label style="margin-top:8px">Foto aktivitas</label><input type="file" accept="image/*" data-up="${i}"><div id="ph${i}" style="margin-top:6px"></div></div>`;
const formPart=(m,mid)=>`<div class="card"><label>Tanggal</label><input type="date" id="dt" value="${st.date}" style="max-width:200px"><div class="mu" style="margin-top:6px">Isi hingga ${N} mitra per hari. Data tersimpan otomatis.</div></div>${mid||""}<div id="rows">${day(m,st.date).map(card).join("")}</div>`;
function bindForm(m){
 $("#dt").onchange=e=>{st.date=e.target.value||today();render()};
 const NUM=["call","visit","kmA","kmB"],root=$("#rows");
 const upd=(i,k,v)=>{const e=day(m,st.date)[i];e[k]=NUM.includes(k)?Math.max(0,+v||0):v;save(m,st.date);
  $("#t"+i).textContent=km(e);$("#r"+i).textContent=rp(bbm(km(e)));
  const a=$("#kpi"),b=$("#rc");if(a)a.innerHTML=kpiHtml(m,st.date);if(b)b.innerHTML=recap(m,st.date)};
 root.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.k)upd(+t.dataset.i,t.dataset.k,t.value)});
 root.addEventListener("click",ev=>{const b=ev.target.closest("button[data-d]");if(!b)return;
  const i=+b.dataset.i,k=b.dataset.k,e=day(m,st.date)[i];upd(i,k,(+e[k]||0)+ +b.dataset.d);
  b.parentNode.querySelector("input").value=day(m,st.date)[i][k]});
 root.addEventListener("focusout",()=>flushAll());
 const key=i=>m+"|"+st.date+"|"+i,showPh=(i,src)=>{const h=$("#ph"+i);if(h)h.innerHTML=src?`<img class="th" data-zoom src="${src}"><button class="d" data-rm="${i}">Hapus foto</button>`:""};
 root.addEventListener("change",async ev=>{const t=ev.target;if(!t.dataset.up)return;const i=+t.dataset.up,f=t.files[0];if(!f)return;
  try{const d=await shrink(f);await pset(key(i),d);day(m,st.date)[i].foto=true;save(m,st.date);showPh(i,d)}catch(x){alert("Foto gagal disimpan.")}t.value=""});
 root.addEventListener("click",async ev=>{const b=ev.target.closest("button[data-rm]");if(!b)return;const i=+b.dataset.rm;await pdel(key(i)).catch(()=>0);day(m,st.date)[i].foto=false;save(m,st.date);showPh(i,"")});
 day(m,st.date).forEach((e,i)=>{if(e.foto)pget(key(i)).then(v=>showPh(i,v))})}
function renderMember(){const m=st.user;
 $("#app").innerHTML=hero("Halo, "+esc(m),"Aktivitas Sales · "+fd(today()))+`<div id="kpi">${kpiHtml(m,st.date)}</div>`+formPart(m,`<div id="rc">${recap(m,st.date)}</div>`);bindForm(m)}

/* ---------- Admin ---------- */
function renderAdmin(){
 const tabs=[["dash","Dashboard"],["edit","Edit Aktivitas"],["mon","Monitoring Mitra"],["set","Target, Anggota & PIN"]];
 $("#app").innerHTML=hero("Dashboard Admin / Manager","Aktivitas Sales · Laznas Yakesma")+`<div class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${st.tab===k?"p":""}">${l}</button>`).join("")}</div><div id="tb"></div>`;
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;render()});
 if(!MEM.includes(st.sel))st.sel=MEM[0];
 ({dash:tDash,edit:tEdit,mon:tMon,set:tSet})[st.tab]($("#tb"))}
const selOpts=(v,all)=>(all?`<option value="all" ${v==="all"?"selected":""}>Semua anggota</option>`:"")+MEM.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
function tDash(el){
 const[s,e]=rng(st.per,st.date),t=tg(st.per),ym=st.date.slice(0,7),[ms,me]=rng("m",st.date);
 const rt=st.per==="m"?ym:st.per==="d"?s:s+" s/d "+e;
 let rows="",sum=0,bb=0;
 for(const m of MEM){const x=stats(m,s,e),pc=pct(x.c,t.call),pv=pct(x.v,t.visit),av=Math.round((pc+pv)/2);sum+=av;bb+=stats(m,ms,me).cl;
  rows+=`<tr><td>${esc(m)}</td><td class="r">${x.c}/${t.call}</td><td class="r">${pc}%</td><td class="r">${x.v}/${t.visit}</td><td class="r">${pv}%</td><td class="r">${av}%</td><td class="r">${x.k}</td><td class="r">${rp(st.per==="m"?x.cl:x.raw)}</td></tr>`}
 const avg=MEM.length?Math.round(sum/MEM.length):0,L=aggD(st.sel,s,e);
 el.innerHTML=`<div class="tabs">${[["d","Harian"],["w","Mingguan"],["m","Bulanan"]].map(([k,l])=>`<button data-per="${k}" class="${st.per===k?"p":""}">${l}</button>`).join("")}</div>
 <input type="date" id="dd" value="${st.date}" style="max-width:200px;margin-bottom:12px">
 <div class="card"><b>Pencapaian Admin/Manager (rata-rata anggota)</b><div class="big">${avg}%</div><div class="mu">${rt} · target per anggota: call ${t.call}, visit ${t.visit}</div><div class="bar" style="height:12px"><i style="width:${avg}%;background:${col(avg)}"></i></div></div>
 <div class="card"><b>Total klaim BBM bulan ${ym}</b><div class="big">${rp(bb)}</div><div class="mu">Per anggota: total KM ÷ 12 × Rp 10.000, maksimal ${rp(T.pagu)}</div></div>
 <h2>Rekap aktivitas per anggota</h2><div class="card tw"><table><tr><th>Anggota</th><th class="r">Call</th><th class="r">% Call</th><th class="r">Visit</th><th class="r">% Visit</th><th class="r">Rata-rata</th><th class="r">Total KM</th><th class="r">Klaim BBM</th></tr>${rows}</table>
 <div class="mu" style="margin-top:8px">Klaim BBM mode harian/mingguan = hitungan KM ÷ 12 × Rp 10.000; mode bulanan sudah dipotong pagu.</div></div>
 <h2>Rekap aktivitas per mitra · ${rt}</h2><div class="card"><label>Anggota</label><select id="sel" style="max-width:260px">${selOpts(st.sel)}</select></div>
 <div class="card tw"><table><tr><th>Mitra</th><th>Tanggal</th><th class="r">Call</th><th class="r">Visit</th><th class="r">KM</th><th class="r">Klaim BBM</th><th>Penjelasan aktivitas</th></tr>`+
 (L.length?L.map(o=>`<tr><td><b>${esc(o.nama)}</b><div class="mu">${esc(o.alamat)}</div></td><td>${fd(o.d)}</td><td class="r">${o.c}</td><td class="r">${o.v}</td><td class="r">${o.k}</td><td class="r">${rp(bbm(o.k))}</td><td>${o.l.map(z=>`<div>${esc(z)}</div>`).join("")}${o.ph.map(k=>`<img hidden class="th" data-zoom data-ph="${esc(k)}">`).join("")}</td></tr>`).join(""):`<tr><td colspan="7" class="mu">Belum ada data pada periode ini.</td></tr>`)+`</table></div>`;
 fillPh(el);
 document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{st.per=b.dataset.per;render()});
 $("#dd").onchange=x=>{st.date=x.target.value||today();render()};
 $("#sel").onchange=x=>{st.sel=x.target.value;render()}}
function tEdit(el){
 el.innerHTML=`<div class="card"><label>Anggota</label><select id="es" style="max-width:260px">${selOpts(st.sel)}</select><div class="mu" style="margin-top:6px">Admin dapat mengubah aktivitas anggota pada tanggal yang dipilih.</div></div>`+formPart(st.sel);
 $("#es").onchange=x=>{st.sel=x.target.value;render()};bindForm(st.sel)}
function tMon(el){
 const L=[];
 for(const m of MEM)if(st.ms==="all"||st.ms===m)for(const d in(S[m]||{}))if(d.startsWith(st.mm))S[m][d].forEach((x,i)=>{if(x.nama.trim()||x.call||x.visit||x.ket)L.push({d,m,x,i})});
 L.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
 el.innerHTML=`<div class="card grid"><div><label>Bulan</label><input type="month" id="mm" value="${st.mm}"></div><div><label>Anggota</label><select id="ms">${selOpts(st.ms,1)}</select></div></div>
 <div class="card tw"><table><tr><th>Tanggal</th><th>Anggota</th><th>Mitra</th><th class="r">Call</th><th class="r">Visit</th><th class="r">KM</th><th>Keterangan aktivitas</th></tr>`+
 (L.length?L.map(({d,m,x,i})=>`<tr><td>${fd(d)}</td><td>${esc(m)}</td><td><b>${esc(x.nama)||"-"}</b><div class="mu">${esc(x.alamat)}</div></td><td class="r">${x.call}</td><td class="r">${x.visit}</td><td class="r">${km(x)}</td><td><b>${x.jenis}</b>${x.ket?": "+esc(x.ket):""}${x.foto?`<div><img hidden class="th" data-zoom data-ph="${esc(m+"|"+d+"|"+i)}"></div>`:""}</td></tr>`).join(""):`<tr><td colspan="7" class="mu">Belum ada aktivitas.</td></tr>`)+`</table></div>`;
 fillPh(el);
 $("#mm").onchange=x=>{st.mm=x.target.value||st.mm;render()};
 $("#ms").onchange=x=>{st.ms=x.target.value;render()}}
function tSet(el){
 el.innerHTML=`<h2 style="margin-top:0">Target bulanan</h2><div class="card"><div class="grid"><div><label>Call / bulan</label><input type="number" id="tc" value="${T.call}"></div><div><label>Kunjungan / bulan</label><input type="number" id="tv" value="${T.visit}"></div><div><label>Pagu BBM / bulan (Rp)</label><input type="number" id="tp" value="${T.pagu}"></div></div>
 <button class="p" id="ts" style="margin-top:10px">Simpan target</button><div class="mu" style="margin-top:6px">Target mingguan = bulanan ÷ 4, harian = bulanan ÷ 20.</div></div>
 <h2>Anggota &amp; PIN</h2><div class="card">${MEM.map((x,i)=>`<div class="ct" style="margin-bottom:8px;flex-wrap:wrap"><span style="min-width:130px">${esc(x)}</span><input data-pi="${i}" value="${esc(getPin(x))}" maxlength="6" inputmode="numeric" style="width:100px"><button data-sp="${i}" style="width:auto;padding:7px 12px">Simpan PIN</button><button class="d" data-del="${i}" style="width:auto;padding:7px 12px">Hapus</button></div>`).join("")}<div class="mu">PIN admin diganti lewat tombol Ganti PIN di atas.</div></div>
 <h2>Tambah anggota</h2><div class="card grid"><div><label>Nama</label><input id="an"></div><div><label>PIN (4–6 angka)</label><input id="ap" maxlength="6" inputmode="numeric"></div><div style="align-self:end"><button class="p" id="aa">Tambah</button></div></div>
 <h2>Diagnosa koneksi</h2><div class="card"><button id="dg">Tes simpan ke server</button><div id="dgr" class="mu" style="margin-top:8px"></div></div>`;
 $("#dg").onclick=async()=>{const r=$("#dgr");r.textContent="Menguji…";const t0=Date.now();
  try{await Promise.race([db.collection("cfg").doc("ping").set({t:t0}),new Promise((_,no)=>setTimeout(()=>no({code:"timeout (tidak ada respons dalam 8 detik)"}),8000))]);r.textContent="✓ Berhasil menyimpan ke server dalam "+(Date.now()-t0)+" ms."}
  catch(e){r.textContent="✗ Gagal: "+(e.code||e.message||e)}};
 $("#ts").onclick=()=>{const c=+$("#tc").value,v=+$("#tv").value,p=+$("#tp").value;if(c<1||v<1||p<0)return alert("Target tidak valid.");T.call=c;T.visit=v;T.pagu=p;saveCfg();alert("Target disimpan.")};
 document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sp,v=document.querySelector(`[data-pi="${i}"]`).value;if(!/^\d{4,6}$/.test(v))return alert("PIN harus 4–6 angka.");setPin(MEM[i],v);alert("PIN "+MEM[i]+" disimpan.")});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(MEM.length<2)return alert("Minimal 1 anggota.");if(confirm("Hapus "+MEM[i]+" dari daftar anggota?")){MEM.splice(i,1);saveCfg();render()}});
 $("#aa").onclick=()=>{const n=$("#an").value.trim(),p=$("#ap").value;if(!n||n===ADM||MEM.includes(n))return alert("Nama kosong atau sudah dipakai.");if(!/^\d{4,6}$/.test(p))return alert("PIN harus 4–6 angka.");MEM.push(n);setPin(n,p);saveCfg();render()}}

/* ---------- Sinkronisasi ---------- */
let cfgReady=false,subKey="",loaded=false,unsub=null;
const loader=t=>`<div class="card" style="text-align:center;margin-top:40px">${t}</div>`;
function renderSetup(){$("#app").innerHTML=`<div class="card" style="max-width:520px;margin:40px auto"><b>Firebase belum dikonfigurasi</b><p>Isi konstanta <code>FB</code> di bagian atas script <code>index.html</code> dengan konfigurasi dari Firebase Console, lalu simpan ulang.</p></div>`}
function showErr(e){const c=e&&e.code||String(e),h=/operation-not-allowed|admin-restricted/.test(c)?"Aktifkan Authentication → Sign-in method → Anonymous di Firebase Console.":/permission-denied/.test(c)?"Periksa Firestore Rules: izinkan baca/tulis untuk pengguna yang sudah login (anonim).":"Periksa konfigurasi Firebase dan koneksi internet.";
 $("#app").innerHTML=`<div class="card" style="max-width:520px;margin:40px auto"><b>Tidak dapat terhubung ke server</b><div class="mu" style="margin:6px 0">Kode: ${esc(c)}</div><div>${h}</div><button class="p" style="margin-top:10px" onclick="location.reload()">Coba lagi</button></div>`}
function want(){
 if(!st.user)return null;
 if(st.user!==ADM)return{k:"m|"+st.user,q:()=>db.collection("days").where("m","==",st.user)};
 if(st.tab==="set")return null;
 let a,b;
 if(st.tab==="mon"){[a,b]=rng("m",st.mm+"-01")}
 else{const x=rng("m",st.date),y=rng("w",st.date);a=x[0]<y[0]?x[0]:y[0];b=x[1]>y[1]?x[1]:y[1]}
 return{k:"a|"+a+"|"+b,q:()=>db.collection("days").where("d",">=",a).where("d","<=",b)}}
function ensure(){const w=want();if(!w)return true;if(w.k===subKey)return loaded;
 if(unsub)unsub();subKey=w.k;loaded=false;
 unsub=w.q().onSnapshot(sn=>{
  sn.docChanges().forEach(ch=>{const x=ch.doc.data(),k=ch.doc.id;if(ch.doc.metadata.hasPendingWrites||timers[k])return;
   if(ch.type==="removed"){if(S[x.m])delete S[x.m][x.d]}else{(S[x.m]=S[x.m]||{})[x.d]=x.rows}});
  const first=!loaded;loaded=true;first?render():refreshLive()},showErr);
 return false}
function refreshLive(){if(!st.user)return;
 if(st.user===ADM){if(st.tab==="dash"||st.tab==="mon")render()}
 else{const a=$("#kpi"),b=$("#rc");if(a)a.innerHTML=kpiHtml(st.user,st.date);if(b)b.innerHTML=recap(st.user,st.date)}}
async function boot(){
 if(!db){render();return}
 $("#app").innerHTML=loader("Menyambungkan ke server…");
 try{await firebase.auth().signInAnonymously()}catch(e){showErr(e);return}
 cfgDoc().onSnapshot(x=>{
  if(x.exists){const c=x.data();if(Array.isArray(c.members)&&c.members.length)MEM.splice(0,MEM.length,...c.members);if(c.target)Object.assign(T,c.target);P=c.pins||{}}
  if(st.user&&st.user!==ADM&&!MEM.includes(st.user))st.user=null;
  const first=!cfgReady;cfgReady=true;
  if(first){render();return}
  if(!st.user){if(!($("#lp")&&$("#lp").value))render()}
  else if(st.user===ADM&&st.tab==="set"&&!(document.activeElement&&document.activeElement.matches("input")))render()},showErr)}

function render(){$("#hl").innerHTML=logoHtml(34);$("#wm").innerHTML=logoHtml(300);$("#ft").innerHTML=`<span class="fl">${logoHtml(26,1)}</span><span>© Laznas Yakesma · Aktivitas Sales</span>`;
 const on=!!st.user;$("#hd").style.display=on?"flex":"none";if(on)$("#who").textContent="👤 "+st.user;
 if(!db){renderSetup();return}
 if(!cfgReady){$("#app").innerHTML=loader("Menyambungkan ke server…");return}
 if(!on){renderLogin();return}
 if(!ensure()){$("#app").innerHTML=loader("Memuat data…");return}
 st.user===ADM?renderAdmin():renderMember()}
$("#exp").onclick=exportXlsx;
$("#bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="aktivitas-sales.json";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;for(const m in o)for(const d in o[m]){(S[m]=S[m]||{})[d]=o[m][d];if(db)db.collection("days").doc(dkey(m,d)).set({m,d,rows:o[m][d],ts:Date.now()});n++}render();alert("Impor selesai: "+n+" hari data.")}catch(x){alert("File tidak valid.")}};r.readAsText(f);e.target.value=""};
boot();
</script>
