<body>
    <!-- Konten aplikasi web Anda di sini -->
    <div id="app">
        <h1>Dashboard Aktivitas Sales</h1>
    </div>

    <script>
        // Contoh fungsi simpan data rekap sales ke Firestore
        function simpanDataSales(namaSales, tanggal, dataAktivitas) {
            db.collection("sales_activities").doc(`${namaSales}_${tanggal}`).set({
                sales: namaSales,
                date: tanggal,
                activities: dataAktivitas,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Data berhasil disimpan ke Cloud Firebase secara real-time!");
            })
            .catch((error) => {
                console.error("Gagal menyimpan data: ", error);
            });
        }
    </script>
